name: Build Crypto Data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  CONAN_REVISIONS_ENABLED: "1"

jobs:
  windows:
    name: windows-msvc-legacy-conan
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout CryptoData source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Conan 1.x
        run: python -m pip install "conan==1.66.0"

      - name: Create build directory
        run: cmake -E make_directory build

      - name: Install Conan packages
        shell: pwsh
        working-directory: ./build
        run: |
          conan lock create .. --lockfile ../conan.lock --lockfile-out conan-ci.lock --build=missing -s compiler="Visual Studio" -s compiler.version=17 -s build_type=Release
          conan install .. --lockfile conan-ci.lock --build=missing

      - name: Configure CMake
        shell: pwsh
        working-directory: ./build
        run: cmake .. -DBUILD_TESTS_CRYPTODATA=on -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ./build
        shell: pwsh
        run: cmake --build . --parallel --config Release

      - name: Test offline fixtures
        working-directory: ./build
        shell: pwsh
        run: |
          $env:PATH = "$PWD/bin/bin;$env:PATH"
          ctest --test-dir bin -C Release --output-on-failure --timeout 15
